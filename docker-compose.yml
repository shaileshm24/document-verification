# docker-compose.yml — Local development services
# Database: YugabyteDB (PostgreSQL-compatible, distributed)
# YugabyteDB exposes port 5413 for YSQL (PostgreSQL wire protocol)

services:

  # ── YUGABYTEDB ──────────────────────────────────────────────────────────────
  # Single-node YugabyteDB for local dev
  # YSQL (PostgreSQL-compatible) on port 5413
  # YCQL (Cassandra-compatible) on port 9042 — not used here
  # YugabyteDB Admin UI on port 15433
  yugabyte:
    image: yugabytedb/yugabyte:latest
    container_name: loan-fraud-yugabyte

    environment:
      YSQL_DB: loan_fraud_db

    ports:
      - "5413:5433"    # YSQL — PostgreSQL-compatible wire protocol
      - "7000:7000"    # YB-Master Admin UI
      - "9000:9000"    # YB-TServer Admin UI
      - "15433:15433"  # YugabyteDB Admin UI

    volumes:
      - yugabyte_data:/home/yugabyte/yb_data

    command: >
      bash -c "
        bin/yugabyted start
          --daemon=false
          --base_dir=/home/yugabyte/yb_data
          --listen=0.0.0.0
          --tserver_flags=ysql_enable_auth=true
      "

    healthcheck:
      test: ["CMD", "bin/yugabyted", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── YUGABYTEDB DB INIT ──────────────────────────────────────────────────────
  # Creates the database, user, and grants privileges after YugabyteDB is ready
  yugabyte-init:
    image: yugabytedb/yugabyte:latest
    container_name: loan-fraud-yugabyte-init

    depends_on:
      yugabyte:
        condition: service_healthy

    entrypoint: >
      bash -c "
        echo 'Waiting for YSQL to be ready...' &&
        sleep 10 &&

        echo 'Creating user if not exists...' &&

        bin/ysqlsh -h yugabyte -p 5433 -U yugabyte -d yugabyte -c \"
          DO \\\$\\\$
          BEGIN
            IF NOT EXISTS (
              SELECT FROM pg_catalog.pg_roles
              WHERE rolname = 'loanuser'
            ) THEN
              CREATE USER loanuser WITH PASSWORD 'loanpass123';
            END IF;
          END
          \\\$\\\$;
        \" &&

        echo 'Creating database if not exists...' &&

        DB_EXISTS=$$(bin/ysqlsh \ -h yugabyte -p 5433 -U yugabyte -d yugabyte -tAc \"
          SELECT 1 FROM pg_database WHERE datname='loan_fraud_db';
        \") &&

        if [ -z "$$DB_EXISTS" ]; then
          bin/ysqlsh -h yugabyte -p 5433 -U yugabyte -d yugabyte -c \"
            CREATE DATABASE loan_fraud_db OWNER loanuser;
          \"
        else
          echo 'Database already exists.'
        fi &&

        bin/ysqlsh -h yugabyte -p 5433 -U yugabyte -d yugabyte -c \"
          GRANT ALL PRIVILEGES ON DATABASE loan_fraud_db TO loanuser;
        \" &&

        echo 'YugabyteDB init complete.'
      "

    restart: "no"

  # ── REDIS ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: loan-fraud-redis

    ports:
      - "6379:6379"

    command: redis-server --save 60 1 --loglevel warning

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FAKE GCS SERVER ─────────────────────────────────────────────────────────
  # Local Google Cloud Storage emulator
  # Set STORAGE_EMULATOR_HOST=http://localhost:4443 in backend/.env for local dev
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: loan-fraud-fake-gcs

    ports:
      - "4443:4443"

    volumes:
      - gcs_data:/data

    command: -scheme http -port 4443 -public-host localhost:4443

  # ── BULL BOARD ──────────────────────────────────────────────────────────────
  # Queue monitoring UI — http://localhost:3002
  bull-board:
    image: deadly0/bull-board
    container_name: loan-fraud-bull-board

    ports:
      - "3002:3000"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

volumes:
  yugabyte_data:
  redis_data:
  gcs_data: